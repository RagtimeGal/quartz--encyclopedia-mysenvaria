name: Canon/Lore Issue
description: "Report a consistency mistake with the setting's lore or canon."
title: "[Canon Error]: "
labels: [canon]
body:
  - type: textarea
    attributes:
      label: Lore Precedent
      description: Provide evidence of a precedent for the lore set by prior articles.
      placeholder: "Article `a` and `b` say that 2 + 2 equals 4."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problematic Article(s)
      description: A list of articles which go against the precendent and how they break that precendent.
      placeholder: "Article `c` and `d` say that 2 + 2 equals 5."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Suggested Fix
      description: How should the text be changed or corrected?
      placeholder: "Change articles `c` and `d` to say that 2 + 2 equals 4."
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Submission Agreement
      options:
      - label: "By checking this box you confirm that you have read and agree to the Encyclopedia Mysenvaria's [Contribution Policy](https://github.com/RagtimeGal/quartz--encyclopedia-mysenvaria?tab=contributing-ov-file#readme), and grant the Project a perpetual, irrevocable, royalty-free license to use, edit, and integrate your submission into the project."
        required: true
