name: Code Suggestion
description: "Make a suggestion to improve the Encyclopedia's back-end or ui."
title: "[Code]: "
labels: [code]
body:
  - type: textarea
    attributes:
      label: Suggestion
      description: What are you suggesting be changed? How will this improve the Encyclopedia for users.
      placeholder: "The spacing of the GlobGlab on each page is odd. Improvements can be made to the spacing which will make it easier for readers to follow."
    validations:
      required: true
  - type: textarea
    attributes:
      label: The Change
      description: What code needs to be edited to make this possible, and how should it be edited. Please be as detailed as possible in your description.
      placeholder: "The GlobGlab Quartz plugin needs to be edited at line `x` to actually be `y`, this will make the spacing larger."
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Submission Agreement
      options:
      - label: "By checking this box you confirm that you have read and agree to the Encyclopedia Mysenvaria's [Contribution Policy](https://github.com/RagtimeGal/quartz--encyclopedia-mysenvaria?tab=contributing-ov-file#readme), and grant the Project a perpetual, irrevocable, royalty-free license to use, edit, and integrate your submission into the project.
      "
        required: true
