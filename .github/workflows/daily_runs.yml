name: Run daily programs

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:      # manual trigger

permissions:
  contents: write       # needed to push the changes back

jobs:
  run-daily:
    # Prevent the job from running when the bot itself creates a commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # Checkout the repository (full history is required for committing)
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # Set up Python
      # ------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ------------------------------------------------------------------
      # Install dependencies (PyYAML is required by the scripts)
      # ------------------------------------------------------------------
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          # If a requirements file exists for the daily scripts, use it
          if [ -f content/Meta/Programs/run_daily/requirements.txt ]; then
            pip install -r content/Meta/Programs/run_daily/requirements.txt
          fi

      # ------------------------------------------------------------------
      # Execute every script in the run_daily directory
      # ------------------------------------------------------------------
      - name: Run daily programs
        run: |
          echo "Starting daily programs"
          for f in content/Meta/Programs/run_daily/*.py; do
            echo "Running $f"
            python "$f"
          done
          echo "All daily programs finished"

      # ------------------------------------------------------------------
      # Commit and push any modifications made by the scripts
      # ------------------------------------------------------------------
      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): daily script updates [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
