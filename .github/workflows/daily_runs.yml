name: Run daily programs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          if [ -f content/Meta/Programs/run_daily/requirements.txt ]; then
            pip install -r content/Meta/Programs/run_daily/requirements.txt
          fi

      # MANDATORY: Run aggregator so daily scripts have fresh data
      - name: Run Metadata Aggregator
        run: |
          python content/Meta/Programs/debug/metadata_aggregator/metadata_aggregator.py

      - name: Run daily programs
        run: |
          for f in content/Meta/Programs/run_daily/*.py; do
            echo "Running $f"
            python "$f"
          done

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): daily auto-update [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi