name: Run daily programs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          if [ -f content/Meta/Programs/run_daily/requirements.txt ]; then
            pip install -r content/Meta/Programs/run_daily/requirements.txt
          fi

      # MANDATORY: Run aggregator so daily scripts have fresh data
      - name: Run Metadata Aggregator
        run: |
          echo "=== Generating Metadata Database ==="
          # Check primary location first, then fallback to search
          PRIMARY_PATH="content/Meta/Programs/run_on_push/metadata_aggregator.py"
          
          if [ -f "$PRIMARY_PATH" ]; then
            echo "Running aggregator at: $PRIMARY_PATH"
            python "$PRIMARY_PATH"
          else
            echo "Primary path not found, searching..."
            SEARCH_PATH=$(find content/Meta/Programs -name "metadata_aggregator.py" | head -n 1)
            if [ -n "$SEARCH_PATH" ]; then
              python "$SEARCH_PATH"
            else
              echo "::error ::Could not find metadata_aggregator.py in content/Meta/Programs"
              exit 1
            fi
          fi
          echo "=== Metadata aggregation complete ==="

      - name: Run daily programs
        run: |
          if [ -d "content/Meta/Programs/run_daily" ]; then
            for f in content/Meta/Programs/run_daily/*.py; do
              echo "------------------------------------------------------------"
              echo "Running: $f"
              echo "------------------------------------------------------------"
              python "$f"
              echo ""
            done
          else
            echo "Directory content/Meta/Programs/run_daily not found."
          fi

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): daily auto-update [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi