name: Run scripts on push

on:
  push:
    branches:
      - v4 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scripts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git-based scripts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install required Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          if [ -f content/Meta/Programs/run_on_push/requirements.txt ]; then
            pip install -r content/Meta/Programs/run_on_push/requirements.txt
          fi

      - name: Run Metadata Aggregator
        run: |
          echo "=== Generating Metadata Database ==="
          # Check primary location first, then fallback to search
          PRIMARY_PATH="content/Meta/Programs/run_on_push/metadata_aggregator.py"
          
          if [ -f "$PRIMARY_PATH" ]; then
            echo "Running aggregator at: $PRIMARY_PATH"
            python "$PRIMARY_PATH"
          else
            echo "Primary path not found, searching..."
            SEARCH_PATH=$(find content/Meta/Programs -name "metadata_aggregator.py" | head -n 1)
            if [ -n "$SEARCH_PATH" ]; then
              python "$SEARCH_PATH"
            else
              echo "::error ::Could not find metadata_aggregator.py in content/Meta/Programs"
              exit 1
            fi
          fi
          echo "=== Metadata aggregation complete ==="

      - name: Run all scripts in run_on_push
        run: |
          echo "=== Starting run_on_push scripts ==="
          if [ -d "content/Meta/Programs/run_on_push" ]; then
            for f in content/Meta/Programs/run_on_push/*.py; do
              # IMPORTANT: Skip the aggregator here since we ran it manually above
              if [[ "$f" == *"metadata_aggregator.py"* ]]; then
                continue
              fi
              echo "------------------------------------------------------------"
              echo "Running: $f"
              echo "------------------------------------------------------------"
              python "$f"
              echo ""
            done
          else
            echo "Directory content/Meta/Programs/run_on_push not found."
          fi
          echo "=== All scripts completed ==="

      - name: Commit and push changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Committing updates..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): auto-update from run_on_push scripts [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi