name: Run scripts on push

on:
  push:
    branches:
      - v4          # <-- use your real branch name; if it's 'main', put main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scripts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install required Python packages
        run: |
          python -m pip install --upgrade pip
          # Ensure PyYAML is always available for YAML parsing
          pip install pyyaml
          # Optionally install anything else if a requirements file exists
          if [ -f content/Meta/Programs/run_on_push/requirements.txt ]; then
            pip install -r content/Meta/Programs/run_on_push/requirements.txt
          fi

      # --- NEW STEP: AGGREGATE METADATA FIRST ---
      - name: Run Metadata Aggregator
        run: |
          echo "=== Generating Metadata Database ==="
          # Adjust path if your aggregator is kept somewhere else
          python content/Meta/Programs/debug/metadata_aggregator/metadata_aggregator.py
          echo "=== Metadata aggregation complete ==="

      - name: Run all scripts in run_on_push
        run: |
          echo "=== Starting run_on_push scripts ==="
          # We skip the aggregator if it's in this folder to avoid running it twice
          for f in content/Meta/Programs/run_on_push/*.py; do
            if [[ "$f" == *"metadata_aggregator.py"* ]]; then
              continue
            fi
            echo "------------------------------------------------------------"
            echo "Running: $f"
            echo "------------------------------------------------------------"
            python "$f"
            echo ""
          done
          echo "=== All scripts completed ==="

      - name: Commit and push changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Committing updates..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): auto-update from run_on_push scripts [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi